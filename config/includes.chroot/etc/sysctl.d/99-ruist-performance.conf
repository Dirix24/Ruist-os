# Ruist OS - ajustes de rendimiento para juegos y desarrollo

# Memoria (con zram activo conviene un swappiness alto)
vm.swappiness = 100
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.page-cluster = 0

# Necesario para juegos con Proton/Wine y motores grandes
vm.max_map_count = 2147483642

# Compilar y editar proyectos grandes (IDEs, Godot, Unity, etc.)
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# Planificador: agrupa procesos por sesión para mantener el escritorio fluido
kernel.sched_autogroup_enabled = 1

# Menos ruido y trabajo en segundo plano
kernel.nmi_watchdog = 0

# Red: menos latencia
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
