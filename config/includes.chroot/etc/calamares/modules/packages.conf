backend: apt

# No refrescar APT durante la instalación: la base live debe poder instalarse offline.
# Los índices y las actualizaciones se gestionan después desde Ruist Update.
update_db: false
update_system: false

operations:
  - remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'live-task-localisation'
      - 'live-task-recommended'
      - 'calamares-settings-debian'
